<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="潮見帳">
<meta name="theme-color" content="#0c2430">
<title>潮見帳 — クロダイ釣行記録（東京湾奥）</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --bg: #0c2430;
    --surface: #123240;
    --surface-2: #17404f;
    --line: rgba(237,230,214,0.12);
    --ink: #ede6d6;
    --ink-dim: #9fb3b9;
    --bronze: #b08650;
    --bronze-bright: #d1a469;
    --teal: #3e9c8c;
    --rust: #a85c42;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: radial-gradient(1200px 800px at 80% -10%, #123544 0%, var(--bg) 55%);
    color: var(--ink);
    font-family: "Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
    min-height:100vh;
    padding-bottom: 84px;
  }
  h1,h2,h3,.display{
    font-family: "Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  header.top{ padding: 16px 18px 12px; position: relative; overflow: hidden; border-bottom: 1px solid var(--line); }
  header.top svg.wave{ position:absolute; left:0; right:0; bottom:-2px; width:100%; height:28px; opacity:0.5; }
  .brand{ display:flex; align-items:baseline; gap:10px; }
  .brand .kanji{ font-size: 22px; color: var(--bronze-bright); }
  .brand .sub{ font-size: 10px; color: var(--ink-dim); letter-spacing:0.15em; }
  main{ max-width: 720px; margin: 0 auto; padding: 0; }
  .panel{ display:none; }
  .panel.active{ display:block; animation: fade .25s ease; }
  @keyframes fade{ from{opacity:0; transform: translateY(4px);} to{opacity:1; transform:none;} }
  .card{ background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin: 14px 14px 0; }
  .card:last-child{ margin-bottom:14px; }
  .card h3{ margin: 0 0 12px; font-size: 14px; color: var(--bronze-bright); }
  label{ display:block; font-size: 12px; color: var(--ink-dim); margin: 10px 0 4px; }
  input[type=text], input[type=number], input[type=date], input[type=time], select, textarea{
    width:100%; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink);
    border-radius: 8px; padding: 9px 10px; font-size: 14px; font-family: inherit;
  }
  input[readonly]{ opacity:0.75; }
  textarea{ min-height: 56px; resize: vertical; }
  .row2{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row3{ display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .checkline{ display:flex; align-items:center; gap:8px; margin-top:12px; }
  .checkline input{ width:auto; }
  button{ font-family: inherit; cursor:pointer; border:none; border-radius: 9px; padding: 10px 16px; font-size: 14px; font-weight:600; }
  .btn-primary{ background: var(--bronze); color: #1a1108; }
  .btn-ghost{ background: transparent; color: var(--ink-dim); border:1px solid var(--line); }
  .btn-danger{ background: transparent; color: var(--rust); border:1px solid var(--rust); }
  .btn-row{ display:flex; gap:10px; margin-top:14px; }
  .tideBadge{ display:inline-flex; align-items:center; gap:6px; background: var(--surface-2); border:1px solid var(--line);
    border-radius: 20px; padding: 6px 12px; font-size: 13px; color: var(--teal); }
  .moon{ width:12px; height:12px; border-radius:50%; background:#e8e0cc; display:inline-block; }
  nav.tabs{ position:fixed; bottom:0; left:0; right:0; background: rgba(12,36,48,0.96); backdrop-filter: blur(6px);
    border-top: 1px solid var(--line); display:flex; z-index: 500; }
  nav.tabs button{ flex:1; background:none; border-radius:0; color: var(--ink-dim); padding: 12px 4px 10px; font-size:11px;
    display:flex; flex-direction:column; align-items:center; gap:4px; }
  nav.tabs button.active{ color: var(--bronze-bright); }
  nav.tabs .ic{ font-size:18px; }
  #mainMap{ height: 46vh; min-height:280px; }
  .mapCard{ padding:0; overflow:hidden; margin-top:0; }
  .recordItem{ border-bottom:1px solid var(--line); padding: 11px 0; display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .recordItem:last-child{ border-bottom:none; }
  .recordItem .meta{ font-size:12px; color:var(--ink-dim); margin-top:2px; }
  .pill{ display:inline-block; font-size:11px; padding:2px 8px; border-radius:10px; margin-right:6px; margin-top:4px; }
  .pill.catch{ background: rgba(62,156,140,0.18); color: var(--teal); }
  .pill.bouzu{ background: rgba(168,92,66,0.18); color: var(--rust); }
  .iconbtn{ background:none; color:var(--ink-dim); padding:4px 8px; font-size:12px; }
  .empty{ text-align:center; color: var(--ink-dim); padding: 24px 10px; font-size:13px; }
  .barRow{ margin-bottom:10px; }
  .barRow .lbl{ display:flex; justify-content:space-between; font-size:12px; color:var(--ink-dim); margin-bottom:3px; }
  .barTrack{ background: var(--surface-2); border-radius:6px; height:10px; overflow:hidden; }
  .barFill{ height:100%; background: linear-gradient(90deg, var(--bronze), var(--teal)); border-radius:6px; }
  dialog{ border:none; border-radius:14px; background: var(--surface); color:var(--ink); padding:18px; width: min(90vw, 360px); }
  dialog::backdrop{ background: rgba(0,0,0,0.55); }
  .hint{ font-size:11px; color: var(--ink-dim); margin-top:6px; line-height:1.5; }
  .leaflet-popup-content-wrapper{ background: var(--surface); color: var(--ink); border-radius:10px; }
  .leaflet-popup-tip{ background: var(--surface); }
  .popupBtn{ display:inline-block; margin-top:6px; background:var(--bronze); color:#1a1108; border-radius:6px; padding:4px 8px; font-size:12px; text-decoration:none; cursor:pointer; }
  .autoTag{ font-size:10px; color:var(--teal); margin-left:6px; }
  .fetchState{ font-size:11px; color:var(--ink-dim); margin-top:4px; }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="kanji display">潮見帳</span>
    <span class="sub">KURODAI FIELD LOG · 東京湾奥</span>
  </div>
  <svg class="wave" viewBox="0 0 400 30" preserveAspectRatio="none">
    <path d="M0 15 Q 20 0 40 15 T 80 15 T 120 15 T 160 15 T 200 15 T 240 15 T 280 15 T 320 15 T 360 15 T 400 15"
      fill="none" stroke="#3e9c8c" stroke-width="1.4"/>
  </svg>
</header>

<main>
  <!-- マップ（ホーム） -->
  <section class="panel active" id="panel-map">
    <div class="card mapCard"><div id="mainMap"></div></div>
    <div class="hint" style="margin:8px 14px 0;">地図をタップ → 新しい場所を登録／ピンをタップ → その場所の記録を見る</div>
    <div class="card" id="quickAddLoc" style="display:none;">
      <h3>新しい場所を登録</h3>
      <label>場所名</label>
      <input type="text" id="newLocName" placeholder="例: 〇〇漁港 北側堤防">
      <div class="btn-row">
        <button class="btn-primary" id="btnSaveLoc" style="flex:1;">登録する</button>
        <button class="btn-ghost" id="btnCancelLoc">取消</button>
      </div>
    </div>
    <div class="card">
      <h3>最近の釣行</h3>
      <select id="filterLocation" style="margin-bottom:10px;"><option value="">場所で絞り込み: すべて</option></select>
      <div id="recordList"></div>
    </div>
  </section>

  <!-- 記録 -->
  <section class="panel" id="panel-record">
    <div class="card">
      <h3>釣行記録</h3>
      <div class="row2">
        <div><label>日付</label><input type="date" id="f-date"></div>
        <div><label>時刻</label><input type="time" id="f-time" value="06:00"></div>
      </div>
      <label>場所</label>
      <select id="f-location"><option value="">場所を選択…（マップをタップして追加）</option></select>

      <div id="autoBox" style="margin-top:12px;">
        <div class="tideBadge"><span class="moon"></span><span id="tideTypeText">潮回り: 日付・場所を選ぶと自動計算</span></div>
        <div class="fetchState" id="fetchState"></div>
      </div>

      <div class="checkline">
        <input type="checkbox" id="f-bouzu">
        <label style="margin:0;" for="f-bouzu">ボウズ（釣れなかった）</label>
      </div>
      <div class="row2">
        <div><label>尾数</label><input type="number" id="f-count" min="0" placeholder="例: 2"></div>
        <div><label>最大サイズ (cm)</label><input type="number" id="f-size" min="0" step="0.5" placeholder="例: 38"></div>
      </div>

      <h3 style="margin-top:18px;">気象データ（自動取得）<span class="autoTag">Open-Meteo</span></h3>
      <div class="row3">
        <div><label>天気</label><input type="text" id="f-weather" readonly></div>
        <div><label>気温 (℃)</label><input type="text" id="f-airtemp" readonly></div>
        <div><label>降水量 (mm/日)</label><input type="text" id="f-rain" readonly></div>
      </div>
      <div class="row2">
        <div><label>風向き</label><input type="text" id="f-winddir" readonly></div>
        <div><label>風の強さ</label><input type="text" id="f-windforce" readonly></div>
      </div>
      <div class="hint">日付・時刻・場所を入力すると、その地点の気象データを自動取得します。水温・溶存酸素は無料で取得できる公開データが無いため記録項目から外しています。</div>

      <label style="margin-top:14px;">メモ</label>
      <textarea id="f-memo" placeholder="仕掛け・ヒットパターンなど"></textarea>

      <div class="btn-row">
        <button class="btn-primary" id="btnSaveRecord" style="flex:1;">記録を保存</button>
        <button class="btn-ghost" id="btnCancelEdit" style="display:none;">編集を取消</button>
      </div>
    </div>
  </section>

  <!-- 分析 -->
  <section class="panel" id="panel-analysis">
    <div class="card">
      <h3>釣果分析</h3>
      <label>軸で見る</label>
      <select id="analysisAxis">
        <option value="tide">潮回り（大潮/中潮…）</option>
        <option value="location">場所</option>
        <option value="winddir">風向き</option>
        <option value="weather">天気</option>
        <option value="hour">時間帯</option>
        <option value="rain">降水量</option>
      </select>
      <div id="analysisResult" style="margin-top:14px;"></div>
    </div>
  </section>
</main>

<nav class="tabs">
  <button class="tab-btn active" data-tab="map"><span class="ic">🗺️</span>マップ</button>
  <button class="tab-btn" data-tab="record"><span class="ic">🎣</span>記録</button>
  <button class="tab-btn" data-tab="analysis"><span class="ic">📊</span>分析</button>
</nav>

<dialog id="detailDialog">
  <div id="detailBody"></div>
  <div class="btn-row">
    <button class="btn-ghost" id="detailEdit">編集</button>
    <button class="btn-danger" id="detailDelete">削除</button>
    <button class="btn-primary" id="detailClose" style="margin-left:auto;">閉じる</button>
  </div>
</dialog>

<script>
/* ---------- ストレージ ---------- */
function hasRemoteStorage(){ return !!(window.storage && window.storage.get); }
async function loadAll(key){
  if(hasRemoteStorage()){
    try{ const r = await window.storage.get(key); return r? JSON.parse(r.value): []; }
    catch(e){ return []; }
  }
  try{ return JSON.parse(localStorage.getItem(key)||'[]'); }catch(e){ return []; }
}
async function saveAll(key, val){
  if(hasRemoteStorage()){
    try{ await window.storage.set(key, JSON.stringify(val)); return; }catch(e){ /* fallthrough */ }
  }
  localStorage.setItem(key, JSON.stringify(val));
}

let locations = [];
let records = [];
let editingId = null;
let detailId = null;
let pendingLatLng = null;

/* ---------- 地図（東京湾奥） ---------- */
const TOKYO_BAY_CENTER = [35.615, 139.86];
const map = L.map('mainMap').setView(TOKYO_BAY_CENTER, 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors', maxZoom: 19
}).addTo(map);
let markers = [];

map.on('click', (e)=>{
  pendingLatLng = e.latlng;
  document.getElementById('quickAddLoc').style.display = 'block';
  document.getElementById('newLocName').focus();
});
document.getElementById('btnCancelLoc').addEventListener('click', ()=>{
  document.getElementById('quickAddLoc').style.display = 'none';
  pendingLatLng = null;
});
document.getElementById('btnSaveLoc').addEventListener('click', async ()=>{
  const name = document.getElementById('newLocName').value.trim();
  if(!name || !pendingLatLng) return;
  const loc = { id: 'loc_'+Date.now(), name, lat: pendingLatLng.lat, lng: pendingLatLng.lng };
  locations.push(loc);
  await saveAll('locations', locations);
  document.getElementById('newLocName').value = '';
  document.getElementById('quickAddLoc').style.display = 'none';
  pendingLatLng = null;
  populateLocationSelects();
  renderMapMarkers();
});

function renderMapMarkers(){
  markers.forEach(m=>map.removeLayer(m));
  markers = [];
  locations.forEach(loc=>{
    const m = L.marker([loc.lat, loc.lng]).addTo(map);
    const count = records.filter(r=>r.locationId===loc.id).length;
    m.bindPopup(`<b>${loc.name}</b><br>釣行 ${count}回<br><span class="popupBtn" data-loc="${loc.id}">この場所で記録する</span>`);
    m.on('popupopen', ()=>{
      const btn = document.querySelector(`.popupBtn[data-loc="${loc.id}"]`);
      if(btn) btn.addEventListener('click', ()=>{
        document.getElementById('f-location').value = loc.id;
        goToTab('record');
        updateAutoFields();
      });
    });
    markers.push(m);
  });
}

function populateLocationSelects(){
  const opts = locations.map(l=>`<option value="${l.id}">${l.name}</option>`).join('');
  document.getElementById('f-location').innerHTML = '<option value="">場所を選択…（マップをタップして追加）</option>' + opts;
  document.getElementById('filterLocation').innerHTML = '<option value="">場所で絞り込み: すべて</option>' + opts;
}
function locName(id){ const l = locations.find(x=>x.id===id); return l? l.name : '（不明な場所）'; }
function locOf(id){ return locations.find(x=>x.id===id); }

/* ---------- タブ切替 ---------- */
function goToTab(name){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
  if(name==='map') setTimeout(()=>map.invalidateSize(), 50);
}
document.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click', ()=>goToTab(b.dataset.tab)));

/* ---------- 潮回り（月齢から算出・完全ローカル計算） ---------- */
function moonAge(date){
  // 既知の新月: 2000-01-06 18:14 UTC を基準に朔望月 29.53058867 日で算出
  const knownNewMoon = Date.UTC(2000,0,6,18,14,0);
  const synodic = 29.53058867;
  const diffDays = (date.getTime() - knownNewMoon) / 86400000;
  let age = diffDays % synodic;
  if(age < 0) age += synodic;
  return age;
}
function tideTypeFromAge(age){
  const a = age % 29.53058867;
  if(a<1.5 || a>=28){ return '大潮'; }
  if(a<3.5){ return '中潮'; }
  if(a<5.5){ return '小潮'; }
  if(a<7){ return '長潮'; }
  if(a<9){ return '若潮'; }
  if(a<13.5){ return '中潮'; }
  if(a<16.5){ return '大潮'; }
  if(a<18.5){ return '中潮'; }
  if(a<20.5){ return '小潮'; }
  if(a<22){ return '長潮'; }
  if(a<24){ return '若潮'; }
  return '中潮';
}
function calcTideType(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr+'T12:00:00');
  return tideTypeFromAge(moonAge(d));
}

/* ---------- 気象データ自動取得（Open-Meteo・APIキー不要） ---------- */
function windDirLabel(deg){
  const dirs = ['北','北東','東','南東','南','南西','西','北西'];
  const idx = Math.round(((deg%360)+360)%360 / 45) % 8;
  return dirs[idx];
}
function windForceLabel(kmh){
  if(kmh < 10) return '弱い';
  if(kmh < 20) return '普通';
  if(kmh < 35) return 'やや強い';
  return '強い';
}
function weatherLabel(code, precip){
  // WMO weather code の簡易分類
  if(code===0) return '快晴';
  if(code<=3) return '晴れ';
  if(code<=48) return '曇り';
  if(code<=67 || (code>=80&&code<=82)) return '雨';
  if(code<=77 || (code>=85&&code<=86)) return '雪';
  if(code>=95) return '雷雨';
  return precip>0 ? '雨' : '曇り';
}

async function fetchWeatherAuto(lat, lng, dateStr, timeStr){
  const state = document.getElementById('fetchState');
  state.textContent = '気象データを取得中…';
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(dateStr+'T00:00:00');
  const diffDays = Math.round((today - target)/86400000);
  const params = 'latitude='+lat+'&longitude='+lng+'&start_date='+dateStr+'&end_date='+dateStr+
    '&hourly=temperature_2m,precipitation,weathercode,winddirection_10m,windspeed_10m&timezone=Asia%2FTokyo';
  let url;
  if(diffDays > 90){
    url = 'https://archive-api.open-meteo.com/v1/archive?' + params;
  } else {
    url = 'https://api.open-meteo.com/v1/forecast?' + params + '&past_days=92&forecast_days=16';
  }
  try{
    const res = await fetch(url);
    if(!res.ok) throw new Error('fetch failed');
    const data = await res.json();
    const times = data.hourly.time;
    const targetHour = (timeStr||'06:00').split(':')[0].padStart(2,'0');
    let idx = times.findIndex(t=>t.startsWith(dateStr+'T'+targetHour));
    if(idx===-1) idx = 0;
    const temp = data.hourly.temperature_2m[idx];
    const wcode = data.hourly.weathercode[idx];
    const windDeg = data.hourly.winddirection_10m[idx];
    const windSpeed = data.hourly.windspeed_10m[idx];
    const dayPrecip = data.hourly.precipitation
      .filter((v,i)=>times[i].startsWith(dateStr))
      .reduce((a,b)=>a+(b||0),0);
    state.textContent = '取得完了';
    return {
      weather: weatherLabel(wcode, dayPrecip),
      airtemp: (temp!=null? temp.toFixed(1):'?'),
      rain: dayPrecip.toFixed(1),
      winddir: windDirLabel(windDeg),
      windforce: windForceLabel(windSpeed)
    };
  }catch(err){
    state.textContent = '気象データを取得できませんでした（オフライン、または対応期間外の可能性）';
    return null;
  }
}

async function updateAutoFields(){
  const dateStr = document.getElementById('f-date').value;
  const timeStr = document.getElementById('f-time').value;
  const locId = document.getElementById('f-location').value;
  const tideText = document.getElementById('tideTypeText');

  if(dateStr){
    const tt = calcTideType(dateStr);
    tideText.textContent = '潮回り: ' + tt + '（自動計算）';
  } else {
    tideText.textContent = '潮回り: 日付・場所を選ぶと自動計算';
  }

  const loc = locOf(locId);
  ['f-weather','f-airtemp','f-rain','f-winddir','f-windforce'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('fetchState').textContent = '';

  if(dateStr && loc){
    const w = await fetchWeatherAuto(loc.lat, loc.lng, dateStr, timeStr);
    if(w){
      document.getElementById('f-weather').value = w.weather;
      document.getElementById('f-airtemp').value = w.airtemp;
      document.getElementById('f-rain').value = w.rain;
      document.getElementById('f-winddir').value = w.winddir;
      document.getElementById('f-windforce').value = w.windforce;
    }
  }
}
['f-date','f-time','f-location'].forEach(id=>{
  document.getElementById(id).addEventListener('change', updateAutoFields);
});

document.getElementById('f-bouzu').addEventListener('change', (e)=>{
  document.getElementById('f-count').disabled = e.target.checked;
  document.getElementById('f-size').disabled = e.target.checked;
  if(e.target.checked){ document.getElementById('f-count').value=''; document.getElementById('f-size').value=''; }
});

/* ---------- 記録の保存 ---------- */
function resetForm(){
  editingId = null;
  document.getElementById('f-date').value = '';
  document.getElementById('f-time').value = '06:00';
  document.getElementById('f-location').value = '';
  document.getElementById('f-bouzu').checked = false;
  document.getElementById('f-count').disabled = false;
  document.getElementById('f-size').disabled = false;
  document.getElementById('f-count').value = '';
  document.getElementById('f-size').value = '';
  document.getElementById('f-memo').value = '';
  ['f-weather','f-airtemp','f-rain','f-winddir','f-windforce'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('tideTypeText').textContent = '潮回り: 日付・場所を選ぶと自動計算';
  document.getElementById('fetchState').textContent = '';
  document.getElementById('btnSaveRecord').textContent = '記録を保存';
  document.getElementById('btnCancelEdit').style.display = 'none';
}
document.getElementById('btnCancelEdit').addEventListener('click', resetForm);

document.getElementById('btnSaveRecord').addEventListener('click', async ()=>{
  const date = document.getElementById('f-date').value;
  const locationId = document.getElementById('f-location').value;
  if(!date || !locationId){ alert('日付と場所を入力してください'); return; }
  const bouzu = document.getElementById('f-bouzu').checked;
  const rec = {
    id: editingId || ('rec_'+Date.now()),
    date,
    time: document.getElementById('f-time').value,
    locationId,
    tide: calcTideType(date),
    bouzu,
    count: bouzu? 0 : Number(document.getElementById('f-count').value||0),
    size: bouzu? null : (document.getElementById('f-size').value? Number(document.getElementById('f-size').value): null),
    weather: document.getElementById('f-weather').value,
    airtemp: document.getElementById('f-airtemp').value? Number(document.getElementById('f-airtemp').value): null,
    rain: document.getElementById('f-rain').value? Number(document.getElementById('f-rain').value): null,
    winddir: document.getElementById('f-winddir').value,
    windforce: document.getElementById('f-windforce').value,
    memo: document.getElementById('f-memo').value
  };
  if(editingId){
    records = records.map(r=>r.id===editingId? rec : r);
  } else {
    records.push(rec);
  }
  await saveAll('records', records);
  resetForm();
  renderRecordList(); renderMapMarkers(); renderAnalysis();
  goToTab('map');
});

/* ---------- 記録一覧 ---------- */
document.getElementById('filterLocation').addEventListener('change', renderRecordList);
function renderRecordList(){
  const filterId = document.getElementById('filterLocation').value;
  const list = records
    .filter(r=>!filterId || r.locationId===filterId)
    .sort((a,b)=> (b.date+b.time).localeCompare(a.date+a.time));
  const wrap = document.getElementById('recordList');
  if(list.length===0){ wrap.innerHTML = '<div class="empty">記録がまだありません。マップから場所を登録して釣行を記録しましょう。</div>'; return; }
  wrap.innerHTML = list.map(r=>{
    const pill = r.bouzu
      ? `<span class="pill bouzu">ボウズ</span>`
      : `<span class="pill catch">${r.count}尾${r.size? ' / '+r.size+'cm':''}</span>`;
    return `<div class="recordItem" data-id="${r.id}">
      <div>
        <div>${r.date} ${r.time||''} — ${locName(r.locationId)}</div>
        <div class="meta">${r.tide||''} ${r.weather||''} ${r.winddir? r.winddir+'風':''}</div>
        ${pill}
      </div>
    </div>`;
  }).join('');
  wrap.querySelectorAll('.recordItem').forEach(el=>{
    el.addEventListener('click', ()=>openDetail(el.dataset.id));
  });
}

/* ---------- 詳細ダイアログ ---------- */
const dialog = document.getElementById('detailDialog');
function openDetail(id){
  detailId = id;
  const r = records.find(x=>x.id===id);
  if(!r) return;
  const pill = r.bouzu ? '<span class="pill bouzu">ボウズ</span>' : `<span class="pill catch">${r.count}尾${r.size? ' / '+r.size+'cm':''}</span>`;
  document.getElementById('detailBody').innerHTML = `
    <h3>${locName(r.locationId)}</h3>
    <div class="hint">${r.date} ${r.time||''}</div>
    ${pill}
    <table style="width:100%; font-size:13px; margin-top:10px; border-collapse:collapse;">
      <tr><td style="color:var(--ink-dim); padding:4px 0;">潮回り</td><td>${r.tide||'-'}</td></tr>
      <tr><td style="color:var(--ink-dim); padding:4px 0;">天気</td><td>${r.weather||'-'}</td></tr>
      <tr><td style="color:var(--ink-dim); padding:4px 0;">気温</td><td>${r.airtemp!=null? r.airtemp+'℃':'-'}</td></tr>
      <tr><td style="color:var(--ink-dim); padding:4px 0;">降水量</td><td>${r.rain!=null? r.rain+'mm':'-'}</td></tr>
      <tr><td style="color:var(--ink-dim); padding:4px 0;">風</td><td>${r.winddir||'-'} ${r.windforce||''}</td></tr>
    </table>
    ${r.memo? `<div class="hint" style="margin-top:8px; white-space:pre-wrap;">${r.memo}</div>` : ''}
  `;
  dialog.showModal();
}
document.getElementById('detailClose').addEventListener('click', ()=>dialog.close());
document.getElementById('detailDelete').addEventListener('click', async ()=>{
  if(!confirm('この記録を削除しますか？')) return;
  records = records.filter(r=>r.id!==detailId);
  await saveAll('records', records);
  dialog.close();
  renderRecordList(); renderMapMarkers(); renderAnalysis();
});
document.getElementById('detailEdit').addEventListener('click', ()=>{
  const r = records.find(x=>x.id===detailId);
  if(!r) return;
  editingId = r.id;
  document.getElementById('f-date').value = r.date;
  document.getElementById('f-time').value = r.time||'06:00';
  document.getElementById('f-location').value = r.locationId||'';
  document.getElementById('f-bouzu').checked = r.bouzu;
  document.getElementById('f-count').disabled = r.bouzu; document.getElementById('f-size').disabled = r.bouzu;
  document.getElementById('f-count').value = r.count||'';
  document.getElementById('f-size').value = r.size??'';
  document.getElementById('f-weather').value = r.weather||'';
  document.getElementById('f-airtemp').value = r.airtemp??'';
  document.getElementById('f-rain').value = r.rain??'';
  document.getElementById('f-winddir').value = r.winddir||'';
  document.getElementById('f-windforce').value = r.windforce||'';
  document.getElementById('f-memo').value = r.memo||'';
  document.getElementById('tideTypeText').textContent = '潮回り: ' + (r.tide||'-') + '（自動計算）';
  document.getElementById('btnSaveRecord').textContent = '記録を更新';
  document.getElementById('btnCancelEdit').style.display = 'inline-block';
  dialog.close();
  goToTab('record');
});

/* ---------- 分析 ---------- */
function bucketOf(r, axis){
  switch(axis){
    case 'tide': return r.tide || '不明';
    case 'location': return locName(r.locationId);
    case 'winddir': return r.winddir || '未記録';
    case 'weather': return r.weather || '未記録';
    case 'hour': {
      if(!r.time) return '未記録';
      const h = Number(r.time.split(':')[0]);
      if(h<6) return '未明(0-6時)'; if(h<10) return '朝(6-10時)'; if(h<14) return '昼(10-14時)';
      if(h<18) return '夕方(14-18時)'; return '夜(18-24時)';
    }
    case 'rain': {
      if(r.rain==null) return '未記録'; if(r.rain===0) return '0mm'; if(r.rain<5) return '0-5mm'; if(r.rain<20) return '5-20mm'; return '20mm以上';
    }
    default: return '不明';
  }
}
document.getElementById('analysisAxis').addEventListener('change', renderAnalysis);
function renderAnalysis(){
  const axis = document.getElementById('analysisAxis').value;
  const groups = {};
  records.forEach(r=>{
    const key = bucketOf(r, axis);
    if(!groups[key]) groups[key] = {total:0, catch:0, sizeSum:0, sizeN:0};
    groups[key].total++;
    if(!r.bouzu){ groups[key].catch += r.count||0; }
    if(r.size){ groups[key].sizeSum += r.size; groups[key].sizeN++; }
  });
  const wrap = document.getElementById('analysisResult');
  const keys = Object.keys(groups);
  if(keys.length===0){ wrap.innerHTML='<div class="empty">記録がまだありません</div>'; return; }
  const maxCatch = Math.max(...keys.map(k=>groups[k].catch), 1);
  wrap.innerHTML = keys.sort((a,b)=>groups[b].catch-groups[a].catch).map(k=>{
    const g = groups[k]; const avgSize = g.sizeN? (g.sizeSum/g.sizeN).toFixed(1) : '-';
    return `<div class="barRow">
      <div class="lbl"><span>${k}（釣行${g.total}回）</span><span>${g.catch}尾 / 平均${avgSize}cm</span></div>
      <div class="barTrack"><div class="barFill" style="width:${(g.catch/maxCatch*100)}%"></div></div>
    </div>`;
  }).join('');
}

/* ---------- 初期化 ---------- */
(async function init(){
  locations = await loadAll('locations');
  records = await loadAll('records');
  populateLocationSelects();
  renderMapMarkers();
  renderRecordList();
  renderAnalysis();
  setTimeout(()=>map.invalidateSize(), 100);
})();
</script>
